<!--
CIS-2232: Advanced OOP | Trident Roastery Coffee Order App

List order page
Compiles all database orders in paginated table format to neatly organize and display orders on file
Connected to database

Author: LRML
Since: 10/16/2026
-->

<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: headerFragment}">
    <title id="pageTitle">Trident Roastery | All Coffee Orders</title>
</head>
<body>
<nav th:replace="~{fragments/navHeader :: navbar}"></nav>
<div class="container my-4">

    <div th:if="${messageSuccess}" class="alert alert-success text-center shadow-sm" role="alert" th:text="${messageSuccess}"></div>

    <h2 class="mb-3 text-center" style="color: #6F4E37;">Coffee Orders List</h2>

    <div class="table-responsive">
        <table id="theData" class="table table-striped table-hover align-middle">
            <thead class="text-center text-white" style="background-color: #6f4e37 !important;">
            <tr>
                <th>ID</th>
                <th>Date</th>
                <th>Customer</th>
                <th>Drink</th>
                <th>Size</th>
                <th>Qty</th>
                <th>Grand Total</th>
                <th>Status</th>
                <th>Options</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="current : ${orders}">
                <td th:text="${current.id}" class="text-center"></td>
                <td th:text="${current.orderDate}"></td>
                <td th:text="${current.customerName}"></td>
                <td th:text="${current.drinkType}"></td>
                <td th:text="${current.drinkSize}"></td>
                <td th:text="${current.quantity}" class="text-center"></td>

                <!-- Calculations for each order -->
                <td th:with="sub= ${(current.unitPrice + current.milkSurcharge + (current.extraShots * 1.00)) * current.quantity},
                  tot= ${ (sub + (sub * 0.15)) }"
                    th:text="${'$' + #numbers.formatDecimal(tot, 1, 2)}">
                </td>

                <td th:text="${current.orderStatus}"></td>

                <td class="text-center">
                    <div class="btn-group" role="group">
                        <a th:href="@{/coffeeorder/edit/{id}(id=${current.id})}"
                           class="btn btn-sm btn-outline-primary px-3 py-1 fw-bold text-white shadow-sm"
                           style="background-color: #6F4E37; border-color: #5a3d2b;"
                           title="Edit Order">
                            <i class="fas fa-edit me-1"></i> Edit
                        </a>
                    </div>
                </td>
            </tr>

            <!-- Fallback if no data avail -->
            <tr th:if="${#lists.isEmpty(orders)}">
                <td colspan="9" class="text-center text-muted py-4">
                    No coffee orders found. Make sure the database is set up using the provided script! (resources/db/mysql/createDatabase.sql)
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <!-- Add new button -->
    <div class="text-center mt-3">
        <a th:href="@{/coffeeorder/add}" class="btn btn-success" style="background-color: #6F4E37; border-color: #6F4E37;">
            <i class="fas fa-plus"></i> Add New Coffee Order
        </a>
    </div>
</div>
<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
