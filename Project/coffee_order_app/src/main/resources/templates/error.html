<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head th:include="~{fragments/head :: headerFragment}">
    <title id="pageTitle">Coffee Order Tracker | Error</title>
</head>
<body>
<nav th:replace="~{fragments/navHeader :: navbar}"></nav>

<div class="container my-5 text-center">
    <div class="card shadow-sm p-5 mx-auto" style="max-width: 600px; background-color: #fff; border-top: 5px solid #d9534f;">
        <h2 class="title is-2 text-danger mb-3">
            <i class="fas fa-exclamation-triangle"></i> <span th:text="#{label.error}">Error</span>
        </h2>

        <!-- Dynamic error message from controller if available -->
        <p class="lead text-secondary mt-2" th:if="${errorDetails != null}" th:text="${errorDetails}">
            No detailed error information available. Sorry :(
        </p>
        <p class="lead text-secondary mt-2" th:if="${errorDetails == null}">
            We encountered an unexpected issue processing your request. Please check your inputs or return to the main dashboard.
        </p>

        <div class="mt-4">
            <a th:href="@{/}" class="btn btn-primary" style="background-color: var(--main-color-primary); border-color: var(--main-color-primary);">
                <i class="fas fa-home"></i> Return to Home
            </a>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
