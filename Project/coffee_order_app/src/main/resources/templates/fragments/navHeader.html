<!--
CIS-2232 | Coffee Order Application Project | HTML NavHeader for consistent navigation across project

Displays navigation options neatly in dropdowns
-->

<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<body>
<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container-fluid">
        <!-- Brand / Logo -->
        <a th:href="@{/}" class="navbar-brand d-flex align-items-center">
            <img src="/images/tridentRLogo_256.png" height="40" width="40" class="me-2" alt="logo"/>
            Coffee Orders Tracker
        </a>

        <!-- Mobile Toggle Button -->
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavDropdown"
                aria-controls="navbarNavDropdown" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <!-- Navbar Links -->
        <div class="collapse navbar-collapse" id="navbarNavDropdown">
            <ul class="navbar-nav ms-auto">

                <!-- Order Input/View -->
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                        Orders
                    </a>
                    <ul class="dropdown-menu dropdown-menu-dark">
                        <li><a class="dropdown-item" th:href="@{/coffeeorder}">View All Orders</a></li>
                        <li><a class="dropdown-item" th:href="@{/coffeeorder/add}">Add New Order</a></li>
                    </ul>
                </li>

                <!-- Coffee Order Reporting -->
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                        Reports
                    </a>
                    <ul class="dropdown-menu dropdown-menu-dark">
                        <li><a class="dropdown-item" th:href="@{/report/receipt}">Customer Receipt</a></li>
                        <li><a class="dropdown-item" th:href="@{/report/sales}">Sales Review</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li><a class="dropdown-item" th:href="@{/report/menu}">All Reports Menu</a></li>
                    </ul>
                </li>

                <!-- Other / About -->
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                        Information
                    </a>
                    <ul class="dropdown-menu dropdown-menu-dark">
                        <li><a class="dropdown-item" th:href="@{/about}">About</a></li>
                    </ul>
                </li>
            </ul>
        </div>
    </div>
</nav>
</body>
</html>
